<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פרקליט</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== מסך כניסה ===== */
#pk9Gate{position:fixed;inset:0;z-index:99000;display:block;padding:0;overflow:auto;direction:rtl;opacity:0;pointer-events:none;transition:opacity .4s;background:radial-gradient(90% 110% at 100% 0%,#7E2A38 0%,#5A1B26 38%,#3C121A 72%,#2E0D14 100%)}
#pk9Gate.in{opacity:1;pointer-events:auto}
.pk9e-in{min-height:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(400px,.88fr)}
.pk9e-brand{position:relative;overflow:hidden;padding:56px 72px 48px;color:#F6EAD3;display:flex;flex-direction:column}
.pk9e-wm{position:absolute;left:-60px;bottom:-140px;font:400 620px/1 'Assistant','Heebo',sans-serif;color:rgba(217,184,101,.045);pointer-events:none;user-select:none}
.pk9e-arcs{position:absolute;inset:0;background:repeating-radial-gradient(circle at 0% 100%,transparent 0 46px,rgba(217,184,101,.05) 47px 48px);mask-image:radial-gradient(70% 70% at 0% 100%,#000,transparent);-webkit-mask-image:radial-gradient(70% 70% at 0% 100%,#000,transparent);pointer-events:none}
.pk9e-brand>*:not(.pk9e-wm):not(.pk9e-arcs){position:relative}
.pk9e-logo{display:flex;align-items:center;gap:14px}
.pk9e-logo .seal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:500 26px 'Assistant','Heebo',sans-serif;color:#2A1408;background:radial-gradient(circle at 35% 30%,#F1D78E,#C9A24A 60%,#9E7A2C);box-shadow:0 0 0 4px rgba(217,184,101,.14),0 10px 24px -8px rgba(0,0,0,.6)}
.pk9e-logo b{display:block;font:700 27px 'Assistant','Heebo',sans-serif;color:#fff;letter-spacing:.01em}.pk9e-logo em{font:400 13px var(--pk-ui);font-style:normal;color:#D9B865}
.pk9e-brand h1{font:700 56px/1.12 'Assistant','Heebo',sans-serif;color:#fff;margin:auto 0 30px;padding-top:50px;letter-spacing:-.01em}
.pk9e-sys{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px}
.pk9e-sys button{position:relative;display:flex;gap:14px;align-items:center;text-align:right;padding:16px 18px;border-radius:18px;border:1px solid rgba(243,217,162,.18);background:rgba(255,255,255,.04);color:#F6EAD3;cursor:pointer;transition:.2s;backdrop-filter:blur(6px)}
.pk9e-sys button:hover{background:rgba(255,255,255,.07);border-color:rgba(243,217,162,.35)}
.pk9e-sys button.on{background:linear-gradient(135deg,rgba(217,184,101,.16),rgba(217,184,101,.05));border-color:#D9B865;box-shadow:0 14px 34px -18px rgba(217,184,101,.55)}
.pk9e-sys .ic{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;background:rgba(217,184,101,.14)}
.pk9e-sys button.on .ic{background:#D9B865}
.pk9e-sys svg{width:22px;height:22px;stroke:#E8C877;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.pk9e-sys button.on svg{stroke:#3A1A0C}
.pk9e-sys .tx{flex:1}.pk9e-sys small{display:block;font:600 10.5px var(--pk-ui);letter-spacing:.16em;color:#C9A24A}.pk9e-sys b{display:block;font:700 21px 'Assistant','Heebo',sans-serif;color:#fff}.pk9e-sys em{display:block;font:400 12.5px var(--pk-ui);font-style:normal;color:#CDB79B}
.pk9e-sys .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(243,217,162,.4);flex:none}.pk9e-sys button.on .rd{border:5px solid #D9B865}
.pk9e-feat{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin:28px 0 0;max-width:620px}
.pk9e-feat div{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.pk9e-feat span{grid-row:1/3;width:36px;height:36px;border-radius:11px;border:1px solid rgba(243,217,162,.2);display:grid;place-items:center}
.pk9e-feat svg{width:18px;height:18px;stroke:#D9B865;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pk9e-feat b{font:600 14.5px var(--pk-ui);color:#F6EAD3}.pk9e-feat em{font:400 12.5px var(--pk-ui);font-style:normal;color:#BFA88E}
.pk9e-stats{display:flex;gap:36px;margin-top:36px;padding-top:22px;border-top:1px solid rgba(243,217,162,.14);max-width:620px}
.pk9e-stats b{display:block;font:700 30px 'Assistant','Heebo',sans-serif;color:#E8C877}.pk9e-stats span{font:400 12.5px var(--pk-ui);color:#BFA88E}
.pk9e-side{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:40px 48px;background:radial-gradient(70% 60% at 50% 50%,rgba(122,39,53,.55),rgba(46,13,20,0) 70%)}
.pk9e-side>.pk9e-card{position:relative;z-index:2}
.pk9e-card{width:100%;max-width:430px;background:#FBF8F2;border-radius:28px;padding:34px 34px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.4) inset;animation:pk9eIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pk9eIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pk9e-ch .k{font:600 11.5px var(--pk-ui);letter-spacing:.14em;color:#B8913C}
.pk9e-ch h2{font:700 31px 'Assistant','Heebo',sans-serif;color:#2A1A16;margin:4px 0 2px}.pk9e-ch p{margin:0 0 18px;font:400 14px var(--pk-ui);color:#8A7B70}
.pk9e-tabs{display:flex;background:#EFE8DB;border-radius:13px;padding:4px;margin-bottom:16px}
.pk9e-tabs button{flex:1;height:38px;border:none;border-radius:10px;background:none;font:500 14.5px var(--pk-ui);color:#7A6A5E;cursor:pointer}
.pk9e-tabs button.on{background:#fff;color:#5A1B24;box-shadow:0 1px 3px rgba(60,30,20,.12)}
.pk9e-err{background:#FBEEEE;border:1px solid #EBC9CC;color:#8A2525;border-radius:12px;padding:10px 12px;font:500 13px var(--pk-ui);margin-bottom:12px}
.pk9e-f{position:relative;display:flex;align-items:center;margin-bottom:10px}
.pk9e-f>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid}
.pk9e-f svg{width:19px;height:19px;stroke:#A8978A;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pk9e-f input{width:100%;height:52px;border:1.5px solid #E6DCCD;border-radius:14px;background:#fff;padding:0 46px 0 46px;font:400 15.5px var(--pk-ui);color:#2A1A16;transition:.15s;box-sizing:border-box}
.pk9e-f input:focus{outline:none;border-color:#8A2E3A;box-shadow:0 0 0 4px rgba(138,46,58,.1)}
.pk9e-f input:focus~span svg,.pk9e-f:focus-within>span svg{stroke:#8A2E3A}
.pk9e-f .eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;padding:6px;display:grid}
.pk9e-per{display:flex;gap:6px;margin-bottom:10px}.pk9e-per button{flex:1;height:40px;border:1.5px solid #E6DCCD;border-radius:12px;background:#fff;font:500 14px var(--pk-ui);color:#6A5A50;cursor:pointer}.pk9e-per button.on{border-color:#8A2E3A;color:#5A1B24;background:#FBF1F1}
.pk9e-row{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px;font:400 13px var(--pk-ui);color:#7A6A5E}.pk9e-row label{display:flex;gap:6px;align-items:center;cursor:pointer}.pk9e-row input{accent-color:#8A2E3A}.pk9e-row a{color:#8A2E3A;cursor:pointer}
.pk9e-go{width:100%;height:54px;border:none;border-radius:15px;background:linear-gradient(180deg,#7A2735,#5A1B24);color:#fff;font:600 16px var(--pk-ui);cursor:pointer;box-shadow:0 14px 28px -14px rgba(90,27,36,.9);transition:.15s;margin-top:4px}
.pk9e-go:hover{filter:brightness(1.1);transform:translateY(-1px)}
.pk9e-or{display:flex;align-items:center;gap:12px;margin:20px 0 12px;font:400 12.5px var(--pk-ui);color:#A8978A}.pk9e-or:before,.pk9e-or:after{content:'';flex:1;height:1px;background:#E6DCCD}
.pk9e-demo{display:flex;gap:8px}.pk9e-demo button{flex:1;min-height:44px;border:1.5px solid #E2D2B4;border-radius:13px;background:#FFFBF1;color:#5A1B24;font:500 13.5px var(--pk-ui);cursor:pointer;padding:6px 10px}.pk9e-demo button:hover{border-color:#B8913C}
.pk9e-ft{text-align:center;margin-top:18px;font:400 12px var(--pk-ui);color:#A8978A}.pk9e-ft a{color:#8A7B70;text-decoration:underline;text-underline-offset:3px}
@media (max-width:1100px){.pk9e-brand{padding:44px 44px}.pk9e-brand h1{font-size:44px}}
@media (max-width:900px){
 .pk9e-in{grid-template-columns:1fr}
 .pk9e-brand{padding:26px 20px 22px}.pk9e-brand h1{font-size:32px;margin:22px 0 18px;padding:0}
 .pk9e-feat,.pk9e-stats,.pk9e-wm{display:none}
 .pk9e-sys{gap:8px}.pk9e-sys button{padding:12px;gap:10px}.pk9e-sys .ic{width:36px;height:36px}.pk9e-sys b{font-size:18px}.pk9e-sys em{font-size:11.5px}.pk9e-sys .rd{display:none}
 .pk9e-side{padding:0 14px 30px;background:none}.pk9e-card{padding:24px 20px 20px;border-radius:24px}.pk9e-ch h2{font-size:27px}
 .pk9e-demo{flex-direction:column}
}

/* ===== הצד הכהה: חותם זהב חי ===== */
.pk9e-brand h1 .gold{background:linear-gradient(100deg,#F6DE9B 0%,#D9B865 40%,#B8913C 70%,#F1D78E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:pk9eShine 8s ease-in-out infinite}
@keyframes pk9eShine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.pk9e-stage{position:absolute;inset:0;pointer-events:none;z-index:1}
.pk9e-glow{position:absolute;left:50%;top:50%;width:720px;height:720px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(217,184,101,.20) 0%,rgba(217,184,101,.08) 32%,rgba(217,184,101,0) 62%);animation:pk9eBreath 7s ease-in-out infinite}
@keyframes pk9eBreath{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.pk9e-seal{position:absolute;left:50%;top:50%;width:min(760px,118%);height:auto;transform:translate(-50%,-50%);overflow:visible}
.pk9e-seal .r1{fill:none;stroke:rgba(217,184,101,.32);stroke-width:1.2}.pk9e-seal .r2{fill:none;stroke:rgba(217,184,101,.22);stroke-width:1}.pk9e-seal .r3{fill:none;stroke:rgba(217,184,101,.12);stroke-width:1;stroke-dasharray:2 6}
.pk9e-seal .tk{stroke:rgba(217,184,101,.35);stroke-width:1.2}
.pk9e-seal .spin{transform-origin:300px 300px;animation:pk9eSpin 90s linear infinite}
.pk9e-seal text{font:600 17px 'Assistant',sans-serif;letter-spacing:5px;fill:url(#pk9eG);opacity:.85}
@keyframes pk9eSpin{to{transform:rotate(-360deg)}}
.pk9e-rays{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(217,184,101,.045) 0deg 2deg,transparent 2deg 15deg);mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 62%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 62%);animation:pk9eSpin 240s linear infinite}
.pk9e-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(243,217,162,.16) 1px,transparent 1.4px);background-size:26px 26px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);opacity:.6}
.pk9e-card{box-shadow:0 50px 100px -30px rgba(10,0,4,.85),0 0 0 1px rgba(217,184,101,.25),0 0 80px -20px rgba(217,184,101,.35)}
.pk9e-trust{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin:18px 0 0;font:500 12.5px 'Assistant',sans-serif;color:#7A6A5E}
.pk9e-wm{color:rgba(217,184,101,.05)!important;font-family:'Frank Ruhl Libre',serif!important}
@media (prefers-reduced-motion:reduce){.pk9e-seal .spin,.pk9e-rays,.pk9e-glow,.pk9e-brand h1 .gold{animation:none}}
@media (max-width:900px){.pk9e-stage{display:none}.pk9e-side{background:none}.pk9e-brand h1{font-size:34px}}

/* ===== מסך כניסה · שדרוג נוסף ===== */
#pk9Gate{--mx:70vw;--my:30vh}
.pk9e-dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.pk9e-spot{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(217,184,101,.10),transparent 60%);transition:background .1s}
.pk9e-in{position:relative;z-index:1}
/* כותרת מתחלפת */
.pk9e-rot{position:relative;display:inline-grid;vertical-align:top;min-height:1.15em}
.pk9e-rot .w{grid-area:1/1;opacity:0;transform:translateY(.45em);filter:blur(6px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1),filter .6s;white-space:nowrap}
.pk9e-rot .w.on{opacity:1;transform:none;filter:none}
.pk9e-rot .w.out{opacity:0;transform:translateY(-.45em);filter:blur(6px)}
.pk9e-brand h1 .gold{display:inline-block}
/* כרטיסיות צפות */
.pk9e-floats{position:relative;height:150px;margin:26px 0 -40px;max-width:620px;transition:transform .25s ease-out;pointer-events:none}
.pk9e-fl{position:absolute;display:flex;align-items:center;gap:12px;padding:11px 16px 11px 14px;border-radius:16px;background:rgba(255,248,236,.08);border:1px solid rgba(243,217,162,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);animation:pk9eBob 6s ease-in-out infinite}
.pk9e-fl b{display:block;font:600 14px var(--pk-ui);color:#FBF1DC}.pk9e-fl em{display:block;font:400 12px var(--pk-ui);font-style:normal;color:#C9B39A}
.pk9e-fl.f1{right:0;top:6px}.pk9e-fl.f2{right:250px;top:52px;animation-delay:-2s}.pk9e-fl.f3{right:60px;top:98px;animation-delay:-4s}
@keyframes pk9eBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pk9e-fl .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:700 13px var(--pk-ui);flex:none}
.pk9e-fl .dot.ok{background:rgba(78,154,107,.25);color:#9BE0B4;border:1px solid rgba(155,224,180,.35)}
.pk9e-fl .dot.fire{background:rgba(217,184,101,.18);font-size:16px}
.pk9e-fl .dot.cal{background:rgba(217,184,101,.2);color:#F1D78E;font-size:11.5px;width:44px}
.pk9e-fl .ring{position:relative;width:38px;height:38px;flex:none}.pk9e-fl .ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.pk9e-fl .ring circle{fill:none;stroke-width:3.4}.pk9e-fl .ring .bg{stroke:rgba(255,255,255,.12)}.pk9e-fl .ring .fg{stroke:#D9B865;stroke-dasharray:94.2;stroke-dashoffset:17;stroke-linecap:round}
.pk9e-fl .ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--pk-ui);color:#F1D78E}
/* סעיף היום */
.pk9e-law{margin-top:26px;max-width:620px;padding:14px 18px;border-radius:16px;border:1px solid rgba(243,217,162,.14);background:linear-gradient(90deg,rgba(217,184,101,.07),rgba(217,184,101,0));position:relative}
.pk9e-law:before{content:'';position:absolute;right:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(180deg,#F1D78E,#9E7A2C)}
.pk9e-law .k{font:600 11px var(--pk-ui);letter-spacing:.14em;color:#C9A24A}
.pk9e-law p{margin:4px 0 0;font:400 16px/1.7 'Frank Ruhl Libre','David Libre',serif;color:#EADFCC}
/* חותם: טבעת פנימית */
.pk9e-seal .spin2{transform-origin:300px 300px;animation:pk9eSpinR 140s linear infinite}
@keyframes pk9eSpinR{to{transform:rotate(360deg)}}
.pk9e-seal .r4{fill:none;stroke:rgba(217,184,101,.16);stroke-width:1;stroke-dasharray:1 9}
.pk9e-seal .mk{font:400 20px 'Frank Ruhl Libre',serif!important;letter-spacing:0!important;fill:#D9B865!important;opacity:.55}
/* כרטיס: זכוכית, הטיה, תוויות צפות */
.pk9e-card{transition:transform .25s ease-out,box-shadow .3s;transform-style:preserve-3d;position:relative}
.pk9e-card:before{content:'';position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(135deg,rgba(241,215,142,.9),rgba(217,184,101,.1) 35%,rgba(217,184,101,0) 60%,rgba(241,215,142,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pk9e-card.shake{animation:pk9eShake .45s}
@keyframes pk9eShake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pk9e-f i{position:absolute;right:46px;top:50%;transform:translateY(-50%);font:400 15px var(--pk-ui);font-style:normal;color:#A8978A;pointer-events:none;transition:.18s cubic-bezier(.2,.8,.2,1);background:#fff;padding:0 6px;border-radius:6px}
.pk9e-f input:focus+i,.pk9e-f input:not(:placeholder-shown)+i{top:0;font-size:11.5px;color:#8A2E3A;font-weight:600}
.pk9e-f .ok{position:absolute;left:14px;top:50%;transform:translateY(-50%) scale(.4);opacity:0;color:#2E6B45;font:700 15px var(--pk-ui);transition:.2s}
.pk9e-f .ok.in{opacity:1;transform:translateY(-50%) scale(1)}
.pk9e-caps{display:none;margin:-4px 2px 8px;font:500 12px var(--pk-ui);color:#9A6A10}.pk9e-caps.in{display:block}
.pk9e-str{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:5px;align-items:center;margin:-2px 2px 12px}
.pk9e-str i{height:4px;border-radius:3px;background:#EAE1D2;transition:.25s}.pk9e-str span{font:500 11.5px var(--pk-ui);color:#8A7B70;margin-right:6px;min-width:62px;text-align:left}
.pk9e-str[data-n="1"] i:nth-child(-n+1){background:#C0392B}.pk9e-str[data-n="2"] i:nth-child(-n+2){background:#D98C2B}.pk9e-str[data-n="3"] i:nth-child(-n+3){background:#B8913C}.pk9e-str[data-n="4"] i{background:#2E6B45}
/* כפתור: טעינה והצלחה */
.pk9e-go{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px}
.pk9e-go:after{content:'';position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .7s}
.pk9e-go:hover:after{left:120%}
.pk9e-go .ar{font-size:18px;transition:transform .2s}.pk9e-go:hover .ar{transform:translateX(-4px)}
.pk9e-go .sp{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#F1D78E;animation:pk9eSp .7s linear infinite}
@keyframes pk9eSp{to{transform:rotate(360deg)}}
.pk9e-go.busy .t,.pk9e-go.busy .ar{display:none}.pk9e-go.busy .sp{display:block}
.pk9e-go.done{background:linear-gradient(180deg,#E4C67A,#B8913C);color:#2A1408}.pk9e-go.done .ar{display:none}.pk9e-go.done .t{font-size:22px}
/* מעבר הצלחה */
.pk9e-wipe{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 50%,#6A2230,#2E0D14);clip-path:circle(0% at 50% 50%);transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.pk9e-wipe.in{clip-path:circle(150% at 50% 50%)}
.pk9e-wipe div{text-align:center;opacity:0;transform:translateY(10px);transition:.5s .45s}.pk9e-wipe.in div{opacity:1;transform:none}
.pk9e-wipe .seal{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;font:500 40px 'Frank Ruhl Libre',serif;color:#2A1408;background:radial-gradient(circle at 35% 30%,#F1D78E,#C9A24A 60%,#9E7A2C);box-shadow:0 0 0 8px rgba(217,184,101,.15),0 0 80px rgba(217,184,101,.45)}
.pk9e-wipe b{display:block;margin-top:18px;font:700 30px var(--pk-ui);color:#fff}
/* כניסה מדורגת */
